apiVersion: 1

datasources:
  - name: Zabbix
    uid: infravision-zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: ${ZABBIX_GRAFANA_URL}
    isDefault: false
    editable: false
    version: 1
    jsonData:
      authType: token
      trends: true
      trendsFrom: '7d'
      trendsRange: '4d'
      cacheTTL: '1h'
      timeout: 30
      queryTimeout: 60
      disableDataAlignment: false
    secureJsonData:
      apiToken: ${ZABBIX_GRAFANA_TOKEN}
